<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!--
    Фоновый огонёк для тёплой плашки «Горящие туры». Тот же приём, что и у
    кляксы на лаймовой полке: не отдельная краска, а более густой оттенок
    самого фона. Белым он на светло-персиковом полотне не читался, поэтому
    здесь оранжевый с низкой непрозрачностью. Цвет намеренно не задан
    переменной — фон подключается через background-image, а туда CSS-переменные
    не пробрасываются.
  -->
  <defs>
    <mask id="inner-flame-cut">
      <rect width="128" height="128" fill="white" />
      <path
        fill="black"
        d="M67 58C69 68 79 72 82 82C85 93 78 104 68 106C57 108 48 99 50 88C52 79 59 75 63 69C66 65 66 62 67 58Z"
      />
    </mask>
  </defs>
  <path
    fill="#ff7a18"
    fill-opacity="0.2"
    mask="url(#inner-flame-cut)"
    d="M65 7C72 25 91 33 94 51C97 47 99 41 98 34C110 47 116 62 114 80C112 105 92 122 65 122C38 122 17 106 14 82C11 59 24 37 45 20C42 34 46 45 55 51C52 37 65 29 65 7Z"
  />
</svg>
